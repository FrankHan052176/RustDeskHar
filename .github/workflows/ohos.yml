name: OpenHarmony HAR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-har:
    name: Build arm64 HarmonyOS HAR
    runs-on: ubuntu-22.04
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout HAR source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: R_RustDesk-Har

      - name: Checkout OHOS-enabled RustDesk Core
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: FrankHan052176/rustdesk4ohos
          ref: master
          path: R_RustDesk-Core
          submodules: recursive

      - name: Setup HarmonyOS CLI tools
        uses: ErBWs/setup-ohos@4dbb63025116eb6165ceac58a4bf47cbdc5ac721 # v2
        with:
          version: 6.1.1.280
          cache: true

      - name: Install native build prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake git make ninja-build perl

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-ohos
          components: ''

      - name: Build HarmonyOS HAR
        shell: bash
        run: bash R_RustDesk-Har/scripts/build-har.sh

      - name: Verify HAR artifact
        shell: bash
        run: |
          test -s R_RustDesk-Har/package.har
          tar -tzf R_RustDesk-Har/package.har | grep -F 'package/libs/arm64-v8a/librustdesk_native_har.so'

      - name: Upload HarmonyOS HAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdesk-ohos-har-arm64
          path: R_RustDesk-Har/package.har
          if-no-files-found: error
          compression-level: 0
